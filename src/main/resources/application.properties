PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none

# JWT
mp.jwt.verify.issuer=https://multas.com/issuer
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# HTTP
quarkus.http.host=0.0.0.0

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Requested-With
quarkus.http.cors.access-control-allow-credentials=true
